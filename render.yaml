services:
  - type: web
    name: f1-analytics-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false   # you will fill this in on Render dashboard after Netlify deploy
    autoDeploy: true
